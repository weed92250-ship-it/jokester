<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge a Friend · Jokester</title><meta name="description" content="A Jokester quiz challenge from a friend. Take the quiz and try to beat their score."><link rel="canonical" href="https://jokester.pages.dev/challenge/"><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30251f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:700px;margin:auto;padding:22px}.card{margin-top:55px;background:#fff;border:1px solid #eadfd4;border-radius:25px;padding:30px;text-align:center}.score{font-size:4rem;font-weight:950;color:#a96f4e}.btn{display:inline-block;background:#a96f4e;color:#fff;text-decoration:none;font-weight:900;padding:13px 19px;border-radius:14px;margin:7px}.muted{color:#806f62}</style></head><body><div class="wrap"><div class="card"><div style="font-size:2rem">🎯</div><h1>You've been challenged</h1><p id="copy"></p><div class="score" id="score"></div><a class="btn" href="/quizzes/quiz.html">Take the quiz</a><a class="btn" href="/">Back to Jokester</a><p class="muted">Your result is not sent to a server. Your score stays in your browser.</p></div></div><script>const p=new URLSearchParams(location.search),s=p.get('score'),t=p.get('total')||10;document.getElementById('score').textContent=s?s+'/'+t:'Beat the challenge';document.getElementById('copy').textContent=s?'A friend scored '+s+'/'+t+'. Take the quiz and try to beat that score.':'Take a quick quiz and send your score to a friend.';</script></body></html>
