<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Jokester Profile · XP, Achievements & Streak</title>
<meta name="description" content="See your Jokester XP, level, personal records, streak and achievements.">
<link rel="canonical" href="https://jokester.pages.dev/profile/">
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30251f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:12px;padding:10px 14px;background:#a96f4e;color:#fff;font-weight:900;cursor:pointer;margin-right:8px}.brand{font-weight:900;color:#a96f4e;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.card{background:#fff;border:1px solid #eadfd4;border-radius:20px;padding:20px}.hero{margin-top:28px}.xp{font-size:3.4rem;font-weight:950}.bar{height:12px;background:#eee4db;border-radius:99px;overflow:hidden}.fill{height:100%;background:#a96f4e;width:0}.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.badge{padding:10px;border-radius:12px;background:#f4ece5;color:#8d796a;font-weight:800}.badge.on{background:#ead9cb;color:#4a3527}.muted{color:#806f62}@media(max-width:600px){.grid,.ach{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="top"><a class="brand" href="/">🎭 Jokester</a><a href="/">Play games</a></div>
<div class="hero"><h1>Your Progress</h1><p class="muted">Your progress stays in this browser. No account required.</p><button class="btn" onclick="shareProfile()">📤 Share my progress</button><span id="shareStatus" class="muted"></span></div>
<div class="card"><div class="xp" id="xp">0 XP</div><h2 id="level">Level 1</h2><div class="bar"><div class="fill" id="fill"></div></div><p class="muted" id="next"></p></div>
<div class="grid"><div class="card"><h2>Personal records</h2><p>🎮 Games played: <b id="games">0</b></p><p>🧩 Riddles solved: <b id="riddles">0</b></p><p>🧠 Quizzes completed: <b id="quizzes">0</b></p><p>💯 Best quiz: <b id="quizbest">0</b>/10</p><p>🔥 Day streak: <b id="streak">0</b></p><p>🏆 Best score: <b id="best">0</b></p></div>
<div class="card"><h2>Achievements</h2><div class="ach" id="ach"></div></div></div>
<script>
async function shareProfile(){let s=JSON.parse(localStorage.getItem('jk')||'{}'),x=s.xp||0,l=Math.floor(x/100)+1,t='I reached Level '+l+' with '+x+' XP on Jokester. Can you beat me?';try{if(navigator.share)await navigator.share({title:'My Jokester Progress',text:t,url:location.href});else{await navigator.clipboard.writeText(location.href);shareStatus.textContent=' Profile link copied.'}}catch(e){}}\nconst defs=[['first-game','🎮 First Game'],['ten-games','🎮 10 Games'],['fifty-games','🎮 50 Games'],['first-riddle','🧩 First Riddle'],['ten-riddles','🧩 10 Riddles'],['riddles-50','🧩 50 Riddles'],['quiz-master','🧠 Quiz Master'],['quizzes-10','🧠 10 Quizzes'],['perfect-quiz','💯 Perfect Quiz'],['three-streak','🔥 3 Day Streak'],['seven-streak','🔥 7 Day Streak'],['thirty-streak','🔥 30 Day Streak'],['xp-500','⭐ 500 XP'],['xp-1000','👑 1000 XP']];
const s=JSON.parse(localStorage.getItem('jk')||'{}');const xpv=s.xp||0;const lv=Math.floor(xpv/100)+1;xp.textContent=xpv+' XP';level.textContent='Level '+lv;fill.style.width=(xpv%100)+'%';next.textContent=(100-xpv%100)+' XP to next level';games.textContent=s.played||0;riddles.textContent=s.solved||0;quizzes.textContent=s.quizzes||0;quizbest.textContent=s.quizBest||0;streak.textContent=s.streak||0;best.textContent=s.best||0;ach.innerHTML=defs.map(d=>'<div class="badge '+((s.achievements||[]).includes(d[0])?'on':'')+'">'+d[1]+'</div>').join('');
</script></div></body></html>
