<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funny & Easy Riddles · Jokester</title><meta name="description" content="Free funny, easy and tricky riddles. Solve riddles, reveal answers and try a new challenge every day."><link rel="canonical" href="https://jokester.pages.dev/riddles/"><meta name="robots" content="index,follow"><style>body{font-family:system-ui;margin:0;background:#f7f3ef;color:#30251f}.wrap{max-width:900px;margin:auto;padding:35px 18px}.r{background:#fff;border:1px solid #eadfd4;border-radius:16px;padding:17px;margin:11px 0}.a{color:#795b48;margin-top:9px}a{color:#8b583d;text-decoration:none}</style></head><body><div class="wrap"><a href="/">← Jokester</a><h1>🧩 Funny & Tricky Riddles</h1><p>Free riddles with answers. Try the daily challenge on the home page.</p><div id="list"></div></div><script>const r=[["What has keys but cannot open locks?","A piano."],["What gets wetter the more it dries?","A towel."],["What has to be broken before you can use it?","An egg."],["I have cities, but no houses. I have mountains, but no trees. What am I?","A map."],["What goes up but never comes down?","Your age."],["What has one eye but cannot see?","A needle."],["What can travel around the world while staying in one corner?","A stamp."],["What has hands but cannot clap?","A clock."],["What has a neck but no head?","A bottle."],["What is full of holes but still holds water?","A sponge."],["What has many teeth but cannot bite?","A comb."],["What can you catch but not throw?","A cold."],["What belongs to you but other people use it more than you?","Your name."],["What has words but never speaks?","A book."],["What kind of room has no doors or windows?","A mushroom."],["What can run but never walks?","Water."],["What has a bed but never sleeps?","A river."],["What has a head and a tail but no body?","A coin."],["What gets bigger the more you take away?","A hole."],["What can be cracked, made, told and played?","A joke."],["What has four wheels and flies?","A garbage truck."],["What has a ring but no finger?","A telephone."],["What has a bark but no bite?","A tree."],["What has a tongue but cannot talk?","A shoe."],["What can fill a room but takes up no space?","Light."],["What has 13 hearts but no organs?","A deck of cards."],["What can you hold without ever touching it?","A conversation."],["What is black when clean and white when dirty?","A blackboard."],["What has a spine but no bones?","A book."],["What is so fragile that saying its name breaks it?","Silence."]];document.getElementById("list").innerHTML=r.map((x,i)=>'<article class="r"><strong>Riddle '+(i+1)+': '+x[0]+'</strong><div class="a">Answer: '+x[1]+'</div></article>').join("")</script></body></html>
